[verify]
commands = [
  "bash .verify/checks/route_drift.sh",
  "cargo test",
  "cargo clippy -- -D warnings",
  "cargo check",
  "sh .verify/checks/require_tests.sh token_budget::tests",
  "sh .verify/checks/require_tests.sh budget_vector::tests",
  "sh .verify/checks/require_tests.sh pid_throttle::tests",
  ".verify/playbooks/verify_full_suite.sh",
  ".verify/playbooks/verify_usage_engine.sh",
  ".verify/playbooks/verify_budget_limits.sh",
]

[verify.default]
command = ["cargo", "test"]
timeout_secs = 600
